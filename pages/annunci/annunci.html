<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>presto.it annunci</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../../index.css">
    <style>
        .header{
            position: sticky;
        }
    </style>
</head>

<body class="bg-light">
    <header>
        <div class="logo-top">
            <i class="fa-solid fa-space-shuttle"></i>
        </div>
        <nav>
            <ul>
                <li><a href="../../index.html">Home</a></li>
                <li><a href="../annunci/annunci.html">Annunci</a></li>
                <li><a href="../about/about.html">Chi Siamo</a></li>
            </ul>
        </nav>
    </header>

    

    <main class="container mb-5">
        <div class="row g-4">

            <!-- Colonna Filtri -->
            <aside class="col-12 col-md-4 col-lg-3">
                <div class="card shadow-sm p-3">
                    <h2 class="h4 mb-3">Filtri</h2>

                    <!-- Filtro Categoria -->
                    <div class="mb-3">
                        <label for="filtroCategoria" class="form-label fw-bold">Categoria:</label>
                        <select id="filtroCategoria" class="campoCategoria form-select">
                            <option value="tutte">Tutte le categorie</option>
                        </select>
                    </div>

                    <!-- Filtro Testo -->
                    <div class="mb-3">
                        <label for="filtroTesto" class="form-label fw-bold">Cerca nome:</label>
                        <input type="text" id="filtroTesto" class="campoTesto form-control" placeholder="Cosa cerchi?">
                    </div>

                    <!-- Filtro Prezzo -->
                    <div class="mb-3">
                        <label for="filtroPrezzo" class="form-label fw-bold">
                            Prezzo max: € <span class="valorePrezzo">0</span>
                        </label>
                        <input type="range" id="filtroPrezzo" class="campoPrezzo form-range">
                    </div>

                    <!-- Pulsante Reset -->
                    <button type="button" class="pulsanteReset btn btn-outline-secondary w-100">
                        Resetta Filtri
                    </button>
                </div>
            </aside>

            <!-- Colonna Griglia Annunci -->
            <section class="col-12 col-md-8 col-lg-9">
                <h2 class="h4 mb-3">Lista Annunci</h2>
                <div class="grigliaAnnunci row row-cols-1 row-cols-sm-2 row-cols-md-2 row-cols-lg-3 g-3"></div>
            </section>

        </div>
    </main>

    <script src="./annunci.js"></script>
</body>
</html>
